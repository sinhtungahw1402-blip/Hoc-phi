<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Outer glow circle -->
  <circle cx="256" cy="256" r="180" fill="#ffffff" opacity="0.1" />

  <!-- Graduation Cap / Book Symbol -->
  <g filter="url(#shadow)" transform="translate(0, -20)">
    <!-- Mortarboard top diamond -->
    <polygon points="256,120 400,185 256,250 112,185" fill="#ffffff" />
    <!-- Cap under skull-cap -->
    <path d="M165,210 L165,275 C165,310 347,310 347,275 L347,210 Z" fill="#e2e8f0" opacity="0.9" />
    <!-- Tassel string & drop -->
    <path d="M360,195 Q385,240 388,290" fill="none" stroke="#fbbf24" stroke-width="8" stroke-linecap="round" />
    <circle cx="388" cy="295" r="10" fill="#f59e0b" />
  </g>

  <!-- Big Checkmark Badge / Money Coin Badge at Bottom Right -->
  <g filter="url(#shadow)" transform="translate(230, 230)">
    <circle cx="120" cy="120" r="85" fill="url(#coinGrad)" stroke="#ffffff" stroke-width="8" />
    <!-- Checkmark inside or Currency / Dong symbol -->
    <!-- Checked Tick inside Circle -->
    <path d="M85,120 L110,145 L158,95" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
